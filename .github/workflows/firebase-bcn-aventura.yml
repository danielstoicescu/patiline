name: 🔥 Deploy BCN Aventura to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'bcn-aventura/**'
      - '.github/workflows/firebase-bcn-aventura.yml'
  workflow_dispatch: # Rulare manuală din tab-ul "Actions" (poți alege orice branch)

concurrency:
  group: firebase-bcn-aventura
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Build & deploy (Hosting + Firestore rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bcn-aventura
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bcn-aventura/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🎨 Build CSS (Tailwind)
        run: npm run build

      - name: 🔑 Service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Lipsește secretul FIREBASE_SERVICE_ACCOUNT (vezi bcn-aventura/README.md)."; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: 🔥 Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Lipsește secretul FIREBASE_PROJECT_ID (vezi bcn-aventura/README.md)."; exit 1
          fi
          npx --yes firebase-tools@latest deploy \
            --only hosting,firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive --force
          echo "✅ Live: https://$FIREBASE_PROJECT_ID.web.app"
